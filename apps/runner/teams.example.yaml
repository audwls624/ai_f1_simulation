# 시즌 참가 팀 (DESIGN.md 9·13절, 운영 안내: docs/CODING-AGENTS.md).
#   pnpm -F @f1sim/runner season --teams-file teams.example.yaml [--gps 1] [--concurrency N]
#
# command가 있으면 헤드리스: 러너가 팀 워크스페이스에서 이 명령을 띄운다. "{prompt}"는 짧은 지시로 바뀐다.
# command가 없으면 수동: 러너가 워크스페이스 경로를 알려 주고 제출을 기다린다.
# model은 SeasonLog에 남는 이름이다. 명령 안의 모델 플래그와 같게 둘 것.
teams:
  # ── Claude Code ─────────────────────────────────────────────────────
  # 권한: 워크스페이스 파일 편집 + ./f1sim, 그리고 자기 분석 스크립트(python3·node) — 다른 도구 팀과 같은 수준.
  - team: opus
    agent: coding
    label: claude-code
    model: claude-opus-5-5
    command: [claude, -p, "{prompt}", --model, claude-opus-5-5, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]
  - team: sonnet
    agent: coding
    label: claude-code
    model: claude-sonnet-5-5
    command: [claude, -p, "{prompt}", --model, claude-sonnet-5-5, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]
  - team: fable
    agent: coding
    label: claude-code
    model: claude-fable-5-1
    command: [claude, -p, "{prompt}", --model, claude-fable-5-1, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]

  # ── Codex CLI ───────────────────────────────────────────────────────
  # TODO: -m 값을 Codex에서 쓰는 실제 모델 이름으로 (astra / sol / terra). 워크스페이스는 git 저장소가 아니라 --skip-git-repo-check.
  - team: astra
    agent: coding
    label: codex
    model: astra
    command: [codex, exec, -m, astra, -s, workspace-write, --skip-git-repo-check, "{prompt}"]
  - team: sol
    agent: coding
    label: codex
    model: sol
    command: [codex, exec, -m, sol, -s, workspace-write, --skip-git-repo-check, "{prompt}"]
  - team: terra
    agent: coding
    label: codex
    model: terra
    command: [codex, exec, -m, terra, -s, workspace-write, --skip-git-repo-check, "{prompt}"]

  # ── Grok ────────────────────────────────────────────────────────────
  # 이 머신에 Grok CLI가 없어 수동. 헤드리스로 돌릴 도구가 정해지면 command를 넣는다.
  - team: grok
    agent: coding
    label: grok
    model: grok

  # ── Gemini CLI ──────────────────────────────────────────────────────
  # TODO: -m 값을 쓰려는 Flash 모델 ID로. ./f1sim 실행에 셸 승인이 필요해 approval-mode yolo.
  - team: flash
    agent: coding
    label: gemini-cli
    model: gemini-flash
    command: [gemini, -m, gemini-flash, --approval-mode, yolo, -p, "{prompt}"]

  # ── 기준선 (12절: LLM 팀이 휴리스틱을 꾸준히 못 이기면 툴·패킷을 재검토) ─────────
  - { team: heuristic-01, agent: heuristic }
  - { team: heuristic-02, agent: heuristic }
