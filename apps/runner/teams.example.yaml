# 시즌 참가 팀 (DESIGN.md 9·13절, 운영 안내: docs/CODING-AGENTS.md).
#   pnpm race [--tracks spa] [--gps 1] [--concurrency N]     (루트에서. = pnpm -F @f1sim/runner season --teams-file teams.example.yaml)
#
# command가 있으면 헤드리스: 러너가 팀 워크스페이스에서 이 명령을 띄운다. "{prompt}"는 짧은 지시로 바뀐다.
# command가 없으면 수동: 러너가 워크스페이스 경로를 알려 주고 제출을 기다린다.
# model은 SeasonLog에 남는 이름이다. 명령 안의 모델 플래그와 같게 둘 것.
teams:
  # ── Claude Code ─────────────────────────────────────────────────────
  # 권한: 워크스페이스 파일 편집 + ./f1sim, 그리고 자기 분석 스크립트(python3·node) — 다른 도구 팀과 같은 수준.
  - team: opus
    agent: coding
    label: claude-code
    model: claude-opus-5-5
    command: [claude, -p, "{prompt}", --model, claude-opus-5-5, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]
  - team: sonnet
    agent: coding
    label: claude-code
    model: claude-sonnet-5-5
    command: [claude, -p, "{prompt}", --model, claude-sonnet-5-5, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]
  - team: fable
    agent: coding
    label: claude-code
    model: claude-fable-5-1
    command: [claude, -p, "{prompt}", --model, claude-fable-5-1, --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)", "Bash(python3:*)", "Bash(node:*)"]

  # ── Codex CLI ───────────────────────────────────────────────────────
  # 워크스페이스는 git 저장소가 아니라 --skip-git-repo-check.
  - team: astra
    agent: coding
    label: codex
    model: gpt-6-astra
    command: [codex, exec, -m, gpt-6-astra, -s, workspace-write, --skip-git-repo-check, "{prompt}"]
  - team: sol
    agent: coding
    label: codex
    model: gpt-6.1-sol
    command: [codex, exec, -m, gpt-6.1-sol, -s, workspace-write, --skip-git-repo-check, "{prompt}"]
  - team: terra
    agent: coding
    label: codex
    model: gpt-6.1-terra
    command: [codex, exec, -m, gpt-6.1-terra, -s, workspace-write, --skip-git-repo-check, "{prompt}"]

  # ── Cursor: Grok 4.7 (수동) ─────────────────────────────────────────
  # 러너가 경로를 출력하면 Cursor에서 그 폴더를 열고, Agent 채팅에서 Grok 4.7을 고른 뒤 지시 문장을 보낸다.
  # 헤드리스로 바꾸려면 Cursor CLI 설치 후: command: [cursor-agent, -p, --force, --model, <모델>, "{prompt}"]
  - team: grok
    agent: coding
    label: cursor
    model: grok-4.7

  # ── OpenCode: DeepSeek V4.1 Flash, GLM-5.3 Flash (헤드리스) ─────────────
  # 지금은 로그인 없이 쓸 수 있는 OpenCode Zen 무료판(-free). `opencode auth login`으로 OpenCode Zen에 로그인하면
  # 모델 이름에서 -free를 빼서 유료판으로 (다른 프로바이더면 -m만 바꾼다, 예: zai/glm-5.3-flash).
  # opencode CLI 1.19.5에서 확인: 헤드리스 run이 셸 명령을 승인 없이 실행한다.
  - team: deepseek
    agent: coding
    label: opencode
    model: deepseek-v4.1-flash-free
    command: [opencode, run, -m, opencode/deepseek-v4.1-flash-free, "{prompt}"]
  - team: glm
    agent: coding
    label: opencode
    model: glm-5.3-flash-free
    command: [opencode, run, -m, opencode/glm-5.3-flash-free, "{prompt}"]

  # ── Antigravity: Gemini 3.8 Flash (수동) ─────────────────────────────
  # 러너가 경로를 출력하면 Antigravity에서 그 폴더를 열고, 에이전트 대화에서 Gemini 3.8 Flash를 고른 뒤 지시 문장을 보낸다.
  # 손 안 대고 돌리려면 Gemini CLI로: command: [gemini, -m, <모델 ID>, --approval-mode, yolo, -p, "{prompt}"]
  - team: flash
    agent: coding
    label: antigravity
    model: gemini-3.8-flash

  # ── 기준선 (12절: LLM 팀이 휴리스틱을 꾸준히 못 이기면 툴·패킷을 재검토) ─────────
  - { team: heuristic-01, agent: heuristic }
