# 시즌 참가 팀 (DESIGN.md 9·13절 M5): 코딩 에이전트 팀 + 휴리스틱 팀.
#   pnpm -F @f1sim/runner season --teams-file teams.example.yaml [--gps 2]
#
# 코딩 에이전트 팀은 워크스페이스(기본: OS 임시 디렉터리 아래, 레포 밖)에서 BRIEF.md·TASK.md·packet.json을 읽고
# ./f1sim 명령으로 풍동·전략 시뮬을 쓰고 제출한다. 호출마다 응답 제한 시간은 규정의 response_timeout_s.
#
# command가 있으면 헤드리스: 러너가 워크스페이스에서 이 명령을 띄운다. "{prompt}"는 짧은 지시로 바뀐다.
# command가 없으면 수동: 러너가 워크스페이스 경로를 알려 주고 제출을 기다린다 (그 디렉터리를 코딩 에이전트로 열고 TASK.md를 따르게 한다).
#
# 헤드리스 명령 예시 (플래그는 각 도구 문서로 확인할 것 — 워크스페이스 안의 파일 쓰기와 ./f1sim 실행 권한이 필요하다):
#   Claude Code:  [claude, -p, "{prompt}", --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)"]
#   Codex CLI:    [codex, exec, --full-auto, "{prompt}"]
#   OpenCode:     [opencode, run, "{prompt}"]
#   Cursor CLI:   [cursor-agent, -p, --force, "{prompt}"]
#   Antigravity 같은 IDE 에이전트: command 없이 수동으로.
teams:
  - team: claude
    agent: coding
    label: claude-code
    model: claude-opus-5-5
    command: [claude, -p, "{prompt}", --permission-mode, acceptEdits, --allowedTools, "Bash(./f1sim:*)"]
  - { team: heuristic-01, agent: heuristic }
  - { team: heuristic-02, agent: heuristic }
  - { team: heuristic-03, agent: heuristic }
  - { team: heuristic-04, agent: heuristic }
  - { team: heuristic-05, agent: heuristic }
  - { team: heuristic-06, agent: heuristic }
  - { team: heuristic-07, agent: heuristic }
  - { team: heuristic-08, agent: heuristic }
  - { team: heuristic-09, agent: heuristic }
