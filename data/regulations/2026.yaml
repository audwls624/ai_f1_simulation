# f1sim 2026 시즌 공개 규정 — 팀이 알고 계획하는 규칙 (DESIGN.md 3·5·6·7·8절의 숫자).
# 정보 패킷의 "규정 전문"은 이 파일뿐이다. 엔진 안쪽 계수는 data/model/2026.yaml (비공개).
#
# - 모든 키는 RulesSchema(strict)가 검증한다. 알 수 없는 키·빠진 키는 거부.
# - `TODO(balance)`: 문서에 값이 없어 정한 출발값. 밸런스 하네스(12절)가 조정한다.
#   표시가 없는 값은 문서에 적힌 값 그대로다.
#
# 시즌 중 업그레이드 윈도우(2·3절: GP 8·16 직전, 풍동 5회)는 9절 인터페이스(designCar·planGp만)와
# 아직 맞지 않아 넣지 않았다. 유지하기로 하면 tools에 wind_tunnel_runs_per_upgrade_window: 5를 추가한다.

season: 2026

# ── 3절: 코스트 캡과 비용 곡선 ───────────────────────────────────────────
cost:
  cap_credits: 100          # 프리시즌 설계 총 예산
  exponent: 2               # 비용 = w · x^p. 14절: p는 하네스가 결정
  weights:                  # 크레딧 (x = 1.0 기준). 아키텍처는 비용 0, 변경 불가. TODO(balance): M2에서 출발값 ×1.7 (합 181)
    aero_efficiency: 34
    thermal_efficiency: 31
    weight_reduction: 24
    mech_grip: 20
    tire_management: 17
    ers_capacity: 14
    reliability: 14
    cooling: 10
    dirty_air_resistance: 10
    drs_effect: 7

# ── 3절: 고정 제약 ──────────────────────────────────────────────────────
limits:
  fuel_flow_kg_per_h: 100       # 출력이 여기에 걸린다 → thermal_efficiency가 출력·연비를 동시에 결정
  min_weight_kg: 798            # weight_reduction 1.0 = 최소 무게
  weight_reduction_span_kg: 30  # weight_reduction 0.0 = 최소 무게 + 30 kg

# 3절: 횟수 자체가 규정 (ATR). 9절: 툴 결과 형식
tools:
  wind_tunnel:
    runs_preseason: 20
    noise_sd_s: 0.1             # 9절: 결과 랩타임 노이즈 N(0, 0.1 s)
    wear_compound: medium       # 9절 "마모율 추정"을 보고할 기준 컴파운드 (normal 페이스, 깨끗한 공기)
  strategy_sim:
    runs_per_gp: 5
    default_samples: 20         # 9절 strategySim(plan, nSamples?)의 기본 시드 수. TODO(balance)
    max_samples: 50             # 한 번에 돌릴 수 있는 최대 시드 수. TODO(balance)

# 3절: 1–10위. 패스티스트 랩 포인트 없음
points: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]

penalties:
  dry_compound_rule_s: 30       # 건조 레이스 2종 컴파운드 의무 위반
  resubmissions: 1              # 스펙·전략 검증 실패 시 재제출 기회
  response_timeout_s: 600       # 2절: 응답 제한 시간 기본 10분. 초과는 검증 실패와 동일

# 3절: 재제출도 실패하면 이 스펙 (+ 첫 GP 그리드 최후위), 전략 검증 실패면 이 셋업·기본 전략.
fallback:
  spec:                         # TODO(balance): 문서에 값 없음. 전부 0.7 (약 89 크레딧)
    powertrain: { thermal_efficiency: 0.7, reliability: 0.7, ers_capacity: 0.7, cooling: 0.7 }
    chassis: { weight_reduction: 0.7, mech_grip: 0.7, tire_management: 0.7, wheelbase: long }
    aero: { aero_efficiency: 0.7, philosophy: wing, dirty_air_resistance: 0.7, drs_effect: 0.7 }
  setup: { wing_level: 5, ride_height: mid, ers_mode: balanced }   # TODO(balance)
  plan:                         # 3절 기본 전략: 1스톱 medium→hard, 규칙 없음
    stints: [medium, hard]
    pit_at_fraction: 0.45       # TODO(balance): 피트 랩 = 레이스 랩 × 이 값 (스틴트가 더 많으면 고르게 나눔)

# ── 3·6절: 타이어 ───────────────────────────────────────────────────────
tires:
  allocation_sets: { soft: 8, medium: 3, hard: 2, inter: 4, wet: 3 }   # GP당 세트 (3절)
  qualifying: { compound: soft, sets: 1 }                             # 예선은 soft 1세트 소모 (3절)
  dry_race_min_compounds: 2                                           # 건조 레이스 드라이 컴파운드 최소 종류 (3절)

  # 6절 표. offset_s: 노면별 랩타임 오프셋. warmup_laps: 컴파운드 워밍업 랩.
  # dry_wear_mult: dry 노면 마모 승수 (inter ×3, wet ×4).
  # 슬릭의 damp/wet 오프셋은 문서에 없다 → TODO(balance) (6절 "잘못된 컴파운드는 추가 페널티").
  compounds:
    soft:
      offset_s: { dry: -0.8, damp: 3.0, wet: 12.0 }   # TODO(balance): damp·wet
      wear_per_lap: 0.045
      dry_wear_mult: 1
      cliff_life: 0.25
      warmup_laps: 0
    medium:
      offset_s: { dry: 0.0, damp: 3.5, wet: 12.5 }    # TODO(balance): damp·wet
      wear_per_lap: 0.030
      dry_wear_mult: 1
      cliff_life: 0.20
      warmup_laps: 1
    hard:
      offset_s: { dry: 0.5, damp: 4.0, wet: 13.0 }    # TODO(balance): damp·wet
      wear_per_lap: 0.020
      dry_wear_mult: 1
      cliff_life: 0.15
      warmup_laps: 2
    inter:
      offset_s: { dry: 4.0, damp: 0.0, wet: 1.5 }
      wear_per_lap: 0.035
      dry_wear_mult: 3
      cliff_life: 0.20
      warmup_laps: 0
    wet:
      offset_s: { dry: 8.0, damp: 2.0, wet: 0.0 }
      wear_per_lap: 0.030
      dry_wear_mult: 4
      cliff_life: 0.20
      warmup_laps: 0

  # 6절 deg(life): 클리프 위에서는 선형(life 1.0 → 0, 클리프 → linear_max_s),
  # 클리프 아래에서는 cliff_base_s에서 시작해 가파르게 증가.
  degradation:
    linear_max_s: 1.0
    cliff_base_s: 1.5
    cliff_slope_s: 20           # TODO(balance): 클리프 아래 life 1.0 감소당 +s ("가파르게")

  downforce_wear_relief: 0.1    # 6절: 마모 × (1 − 0.1 · wing_level/10)
  dirty_air_wear: 0.1           # 6절: 마모 × (1 + 0.1 · dirty_air)
  compound_warmup_penalty_s: 0.6  # TODO(balance): 컴파운드 워밍업 랩(표의 warmup_laps)마다 랩타임 +s

# ── 6절: 페이스 모드 ────────────────────────────────────────────────────
pace_modes:
  push:     { lap_delta_s: -0.3, wear_mult: 1.3,  fuel_mult: 1.1, failure_mult: 1.5 }
  normal:   { lap_delta_s: 0.0,  wear_mult: 1.0,  fuel_mult: 1.0, failure_mult: 1.0 }
  conserve: { lap_delta_s: 0.3,  wear_mult: 0.75, fuel_mult: 0.9, failure_mult: 0.8 }

# ── 6절: 연료 ───────────────────────────────────────────────────────────
fuel:
  reserve_kg: 2                 # 시작 연료 = 랩 수 × 랩당 연료 + 여유
  lap_time_per_kg_s: 0.03       # 연료 kg당 랩타임 (F1 통상값)

# ── 7절: 세이프티카 ─────────────────────────────────────────────────────
safety_car:
  duration_laps: [3, 5]         # 발동 시 지속 랩 (균등)
  lap_time_mult: 1.4            # 세이프티카 중 랩타임 ×1.4
  gap_s: 1.0                    # 세이프티카 중 앞차와 갭 1.0 s로 압축
  pit_loss_mult: 0.5            # 세이프티카 중 피트 손실 ×0.5

# ── 5절: 노면 전이 ─────────────────────────────────────────────────────
# 젖음 카운터: 비 오는 랩마다 +1, 마른 랩마다 −1 (0–wet 사이). 카운터 ≥ damp면 damp, ≥ wet면 wet.
# 강우 시작 후 2랩에 damp, 5랩에 wet. 그친 뒤에는 역순으로 마른다.
surface:
  damp_after_rain_laps: 2
  wet_after_rain_laps: 5

forecast:
  window_laps: 10               # 5절: 10랩 윈도우별 강우 확률

# ── 7절: 엔진 폴백 (팀 규칙보다 먼저, 항상) ─────────────────────────────
engine_fallbacks:
  tire_out_extra_s: 10          # tire life ≤ 0 → 강제 피트, 그 랩 +10 s
  wrong_tire_laps: 3            # wet 노면 드라이 타이어 / dry 노면 inter·wet 타이어가 이만큼 지속되면 강제 교체
  compound_rule_laps_left: 5    # 남은 랩 ≤ 5인데 2종 컴파운드 미충족 → 강제 피트

# ── 8절: 전략 DSL 제한 ─────────────────────────────────────────────────
strategy:
  max_variants: 4
  max_rules: 12                 # 변형마다
  max_stints: 4
  max_conditions: 4             # 규칙마다
