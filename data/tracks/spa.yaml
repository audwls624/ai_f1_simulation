# spa — Circuit de Spa-Francorchamps (벨기에). 실제 서킷 (센터라인: spa.csv, 출처·라이선스: NOTICE.md).
# 출발선은 피트 직선, La Source 헤어핀 약 360 m 앞. 시계 방향.
# 레이스 성격 값은 실제 서킷을 따른 출발값 — 전부 TODO(balance).
id: spa
laps: 44                         # 실제 F1 레이스 랩 수
